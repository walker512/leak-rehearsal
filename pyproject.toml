[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"
[project]
name = "leak-rehearsal"
version = "0.2.0"
description = "Fixed synthetic canary leak rehearsal"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "walker512"}]
[project.scripts]
leak-recovery = "leak_rehearsal.recovery:main"
leak-rehearsal = "leak_rehearsal.__main__:main"
[tool.setuptools.packages.find]
include = ["leak_rehearsal*"]
